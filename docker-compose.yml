services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newtonite
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev
    ports:
      - "5432:5432"
    volumes:
      - newtonite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newtonite:newtonite_dev@db:5432/newtonite}
      SECRET_KEY: ${SECRET_KEY:-local-only-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  newtonite_pgdata:
